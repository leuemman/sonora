<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sonora</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sonora">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --accent:#ff2d55; --accent2:#ff6a3d;
  --bg:#050507; --bg2:#0e0e12;
  --text:#fff; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.32);
  --sep:rgba(255,255,255,.09);
  --glass-rgb:38,38,44; --glass-a:.34;
  --fill:rgba(118,118,128,.20); --fill2:rgba(118,118,128,.12);
  --card:rgba(255,255,255,.055);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.42,.5,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f2f2f7; --bg2:#ffffff;
  --text:#000; --text2:rgba(60,60,67,.62); --text3:rgba(60,60,67,.32);
  --sep:rgba(0,0,0,.08);
  --glass-rgb:250,250,252;
  --fill:rgba(118,118,128,.14); --fill2:rgba(118,118,128,.08);
  --card:rgba(255,255,255,.75);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
img{display:block}

/* ---------- ambient background ---------- */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.42;transition:background 1.2s var(--ease);animation:drift 26s ease-in-out infinite alternate}
.blob.b1{top:-30vmax;left:-25vmax;background:radial-gradient(circle,var(--amb1) 0,transparent 65%)}
.blob.b2{bottom:-35vmax;right:-30vmax;background:radial-gradient(circle,var(--amb2) 0,transparent 65%);animation-duration:32s;animation-direction:alternate-reverse}
.blob.b3{top:30%;left:40%;width:45vmax;height:45vmax;background:radial-gradient(circle,var(--amb3) 0,transparent 65%);opacity:.25;animation-duration:40s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-4vmax,8vmax) scale(.95)}}
body{--amb1:#ff2d55;--amb2:#5e2bff;--amb3:#ff9f0a}
body[data-tab="clips"]{--amb1:#0a84ff;--amb2:#30d5c8;--amb3:#5e5ce6}
body[data-tab="library"]{--amb1:#bf5af2;--amb2:#ff2d55;--amb3:#0a84ff}
body[data-tab="settings"]{--amb1:#636366;--amb2:#0a84ff;--amb3:#30d158}
[data-theme="light"] .blob{opacity:.28}

/* ---------- glass ---------- */
.glass{position:relative;background:rgba(var(--glass-rgb),var(--glass-a));-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.28),inset 0 -1px 1px rgba(255,255,255,.05),inset 0 0 0 .5px rgba(255,255,255,.12),0 10px 34px rgba(0,0,0,.32)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 28%,transparent 55%,rgba(255,255,255,.06) 100%);mix-blend-mode:screen}
[data-theme="light"] .glass{box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 0 0 .5px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.12)}

/* ---------- screens ---------- */
#app{position:fixed;inset:0;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 54px) 0 calc(var(--sab) + 170px);display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{display:block;animation:screenIn .45s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.navbar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--sat) + 48px);padding:var(--sat) 16px 0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.navbar.show{opacity:1;pointer-events:auto}
.navbar.glass{border-radius:0;box-shadow:inset 0 -.5px 0 var(--sep)}
.navbar .nt{font-size:17px;font-weight:600;letter-spacing:-.2px}
.head{padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt{font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.sub{color:var(--text2);font-size:15px;margin-top:2px;font-weight:500}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .2s var(--spring)}
.round:active{transform:scale(.88)}
.round svg{width:19px;height:19px}

/* search */
.search{margin:14px 16px 6px;height:44px;border-radius:22px;display:flex;align-items:center;padding:0 6px 0 14px;gap:8px}
.search svg{width:18px;height:18px;color:var(--text2);flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:17px;-webkit-user-select:text;user-select:text}
.search input::placeholder{color:var(--text3)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .clr{width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:var(--text2)}
.search.has .clr{display:grid}
.search .clr svg{width:17px;height:17px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;background:var(--fill);transition:transform .2s var(--spring),background .2s}
.chip:active{transform:scale(.93)}
.chip.g{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.chip svg{width:13px;height:13px;opacity:.7}

.sec{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 10px}
.sh h2{font-size:22px;font-weight:750;letter-spacing:-.5px}
.sh .more{color:var(--accent);font-size:15px;font-weight:600}

/* horizontal cards */
.hs{display:flex;gap:14px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.sq{flex:none;width:150px;scroll-snap-align:start;text-align:left;transition:transform .25s var(--spring)}
.sq:active{transform:scale(.95)}
.sq .art{width:150px;height:150px;border-radius:14px}
.sq .t{font-size:14px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq .a{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wide{flex:none;width:280px;scroll-snap-align:start;text-align:left;transition:transform .25s var(--spring)}
.wide:active{transform:scale(.96)}
.wide .art{width:280px;height:158px;border-radius:16px}

/* art */
.art{position:relative;overflow:hidden;background:var(--fill2);flex:none}
.art img{width:100%;height:100%;object-fit:cover}
.art.demo{display:grid;place-items:center}
.art.demo svg{width:38%;height:38%;color:rgba(255,255,255,.85);filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.art .dur{position:absolute;right:7px;bottom:7px;font-size:11.5px;font-weight:700;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-variant-numeric:tabular-nums}
.art .sheen{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 40%);pointer-events:none}

/* rows */
.list{padding:0 16px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:7px 4px;text-align:left;border-radius:14px;transition:background .15s,transform .2s var(--spring)}
.row:active{background:var(--fill2);transform:scale(.985)}
.row .art{width:54px;height:54px;border-radius:10px}
.row .art.v{width:96px;height:54px}
.row .m{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding:6px 0 12px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.row:last-child .m{border-bottom:0}
.row .t{font-size:16px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.on .t{color:var(--accent)}
.row .dots{width:34px;height:34px;display:grid;place-items:center;color:var(--text2);border-radius:50%;flex:none}
.row .dots svg{width:20px;height:20px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px;vertical-align:-1px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}

/* clip cards */
.clipcard{display:block;width:100%;text-align:left;padding:0 16px;margin-bottom:22px;transition:transform .25s var(--spring)}
.clipcard:active{transform:scale(.975)}
.clipcard .art{width:100%;aspect-ratio:16/9;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.clipcard .info{display:flex;gap:12px;margin-top:11px;align-items:flex-start}
.clipcard .av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.clipcard .t{font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clipcard .a{font-size:13.5px;color:var(--text2);margin-top:3px}

/* hero */
.hero{margin:14px 16px 0;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:16/10;display:block;width:calc(100% - 32px);text-align:left}
.hero .art{position:absolute;inset:0;width:100%;height:100%}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78));display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.hero .t{font-size:22px;font-weight:750;letter-spacing:-.4px;margin-top:4px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .pb{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff}
.hero .pb svg{width:20px;height:20px;margin-left:2px}

/* banners & empty */
.banner{margin:12px 16px 0;padding:14px 16px;border-radius:18px;display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 32px)}
.banner .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none}
.banner .ic svg{width:20px;height:20px}
.banner b{font-size:15px;display:block}
.banner span{font-size:13px;color:var(--text2);display:block;margin-top:2px;line-height:1.35}
.empty{text-align:center;padding:50px 40px;color:var(--text2)}
.empty .ei{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--fill)}
.empty .ei svg{width:30px;height:30px;color:var(--text2)}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:6px}
.empty p{font-size:15px;line-height:1.4}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--fill2) 0,var(--fill) 50%,var(--fill2) 100%);background-size:200% 100%;animation:sk 1.3s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* segmented */
.seg{margin:16px 16px 4px;height:36px;border-radius:18px;display:flex;position:relative;padding:3px;background:var(--fill)}
.seg button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:600;color:var(--text2);transition:color .25s}
.seg button.on{color:var(--text)}
.seg .th{position:absolute;top:3px;bottom:3px;left:3px;border-radius:15px;transition:transform .45s var(--spring),width .3s}

/* playlists grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 16px}
.pl{text-align:left;transition:transform .25s var(--spring)}
.pl:active{transform:scale(.95)}
.mos{aspect-ratio:1;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:var(--fill2)}
.mos .art{width:100%;height:100%;border-radius:0}
.mos.one{grid-template-columns:1fr;grid-template-rows:1fr}
.mos.new{display:grid;place-items:center;grid-template-columns:1fr;border:1.5px dashed var(--text3);background:transparent}
.mos.new svg{width:34px;height:34px;color:var(--accent)}
.pl .t{font-size:15px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .a{font-size:13px;color:var(--text2)}

/* settings */
.group{margin:22px 16px 0}
.gl{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;padding:0 16px 7px;font-weight:500}
.gf{font-size:13px;color:var(--text2);padding:7px 16px 0;line-height:1.4}
.card{border-radius:22px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;width:100%;text-align:left;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:.5px solid var(--sep)}
.cell.nl+.cell::before,.cell.nl::before{left:16px}
.cell .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.cell .ci svg{width:17px;height:17px}
.cell .cl{flex:1;font-size:16.5px}
.cell .cv{color:var(--text2);font-size:15px}
.cell .chev{width:14px;height:14px;color:var(--text3)}
.cell.red .cl{color:#ff453a}
.keybox{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.field{height:46px;border-radius:13px;background:var(--fill2);display:flex;align-items:center;padding:0 6px 0 14px;gap:6px;box-shadow:inset 0 0 0 .5px var(--sep)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.2px;-webkit-user-select:text;user-select:text}
.field input::placeholder{font-family:var(--font);color:var(--text3);letter-spacing:0}
.btns{display:flex;gap:10px}
.btn{flex:1;height:46px;border-radius:14px;font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.s{background:var(--fill)}
.btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:12px;background:var(--fill)}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.pill.ok .d{background:#30d158;box-shadow:0 0 8px #30d158}
.pill.ko .d{background:#ff453a;box-shadow:0 0 8px #ff453a}
.steps{padding:6px 16px 14px;counter-reset:s}
.steps li{list-style:none;position:relative;padding:9px 0 9px 38px;font-size:15px;line-height:1.4;color:var(--text)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--fill);font-weight:700;font-size:13px;display:grid;place-items:center;color:var(--accent)}
.steps code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--fill2);padding:1px 5px;border-radius:5px}
.steps a{color:var(--accent);text-decoration:none;font-weight:600}
.slider{padding:16px}
.slider .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-11px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--fill)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff}
.swatches{display:flex;gap:14px;padding:14px 16px}
.sw{width:34px;height:34px;border-radius:50%;transition:transform .25s var(--spring);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor;transform:scale(1.05)}
.themes{display:flex;gap:10px;padding:14px 16px}
.themes button{flex:1;height:40px;border-radius:12px;background:var(--fill2);font-size:14px;font-weight:600;color:var(--text2)}
.themes button.on{background:var(--fill);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent)}

/* ---------- tab bar ---------- */
.tabbar.glass,.mini.glass,.navbar.glass,.cv-top.glass,.push-top.glass{background:rgba(var(--glass-rgb),calc(var(--glass-a) + .32));-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%)}
.tabbar{position:fixed;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);z-index:80;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 6px;width:min(calc(100% - 28px),420px)}
.tabbar button{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;z-index:2;color:var(--text);font-size:10.5px;font-weight:600;letter-spacing:-.1px;transition:color .3s,transform .25s var(--spring)}
.tabbar button:active{transform:scale(.9)}
.tabbar button svg{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
.lens{position:absolute;top:5px;height:54px;left:6px;border-radius:27px;z-index:1;background:var(--fill);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),inset 0 0 0 .5px rgba(255,255,255,.1);transition:transform .55s var(--spring),width .3s}
.lens.squish{animation:squish .5s var(--ease)}
@keyframes squish{0%{scale:1 1}35%{scale:1.18 .88}100%{scale:1 1}}

/* ---------- mini player ---------- */
.mini{position:fixed;left:50%;bottom:calc(var(--sab) + 86px);z-index:70;width:min(calc(100% - 28px),420px);height:62px;border-radius:31px;display:flex;align-items:center;gap:10px;padding:0 8px 0 7px;transform:translate(-50%,140%);opacity:0;transition:transform .55s var(--spring),opacity .35s;overflow:hidden}
.mini.show{transform:translate(-50%,0);opacity:1}
.mini .slot{width:48px;height:48px;border-radius:24px;flex:none;overflow:hidden;background:var(--fill2)}
.mini.v .slot{width:80px;border-radius:16px}
.mini .mm{flex:1;min-width:0;text-align:left}
.mini .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .round svg{width:24px;height:24px}
.mini .prog{position:absolute;left:28px;right:28px;bottom:4px;height:2.5px;border-radius:2px;background:var(--fill);overflow:hidden}
.mini .prog i{display:block;height:100%;width:0;background:var(--text);opacity:.85;border-radius:2px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:200;transform:translateY(105%);transition:transform .6s var(--ease);display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.np-bg{position:absolute;inset:-60px;z-index:0;overflow:hidden}
.np-bg img,.np-bg .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(60px) saturate(1.8) brightness(.62);transform:scale(1.4)}
.np-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55))}
.np{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 26px calc(var(--sab) + 18px);color:#fff;overflow-y:auto;scrollbar-width:none}
.np::-webkit-scrollbar{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.4);margin:0 auto 6px;flex:none}
.np-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.np-top .k{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.7;text-align:center}
.np-top .k b{display:block;font-size:14px;letter-spacing:0;text-transform:none;opacity:1;font-weight:600;margin-top:1px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-top .round{background:rgba(255,255,255,.14)}
.np .slot{width:100%;aspect-ratio:16/9;border-radius:22px;margin:auto 0 0;box-shadow:0 30px 70px rgba(0,0,0,.55);background:rgba(0,0,0,.25);transition:transform .5s var(--spring)}
.np .slot.paused{transform:scale(.92)}
.np-meta{display:flex;align-items:center;gap:12px;margin-top:30px}
.np-meta .mm{flex:1;min-width:0}
.np-meta .t{font-size:22px;font-weight:750;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta .a{font-size:18px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.np-meta .round{background:rgba(255,255,255,.14)}
.heart.on{color:var(--accent)}
.heart.pop{animation:pop .45s var(--spring)}
@keyframes pop{40%{transform:scale(1.35)}}
.scrub{margin-top:22px}
.scrub input[type=range]::-webkit-slider-runnable-track{height:7px;background:linear-gradient(90deg,rgba(255,255,255,.92) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
.scrub input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-4.5px;box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .2s}
.scrub input[type=range]:active::-webkit-slider-thumb{transform:scale(1.5)}
.times{display:flex;justify-content:space-between;font-size:12.5px;opacity:.6;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:20px 6px 0}
.ctrls .c{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;transition:transform .25s var(--spring),background .2s}
.ctrls .c:active{transform:scale(.85);background:rgba(255,255,255,.1)}
.ctrls .c svg{width:38px;height:38px}
.ctrls .pp{width:86px;height:86px}
.ctrls .pp svg{width:52px;height:52px}
.ctrls .s{width:44px;height:44px;opacity:.6}
.ctrls .s.on{opacity:1;color:var(--accent)}
.ctrls .s svg{width:22px;height:22px}
.ctrls .s .one{position:absolute;font-size:9px;font-weight:800;margin-top:1px}
.np-bot{display:flex;justify-content:space-around;margin-top:26px;padding-bottom:4px}
.np-bot .round{width:44px;height:44px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
.np-bot .round.on{background:#fff;color:#000}
.queue{margin-top:18px;display:none}
.queue.show{display:block}
.queue h3{font-size:17px;font-weight:700;margin:6px 0 8px}
.queue .row .a{color:rgba(255,255,255,.6)}
.queue .row .m{border-color:rgba(255,255,255,.1)}
.queue .row:active{background:rgba(255,255,255,.08)}
.hint{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;z-index:2}
.hint.show{display:grid}
.hint span{background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:14px}

/* clip view */
#clipSheet{z-index:300;background:var(--bg)}
.cv{flex:1;overflow-y:auto;padding-bottom:calc(var(--sab) + 30px);scrollbar-width:none;position:relative;z-index:1}
.cv::-webkit-scrollbar{display:none}
.cv-top{padding:calc(var(--sat) + 6px) 12px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.cv .slot{width:100%;aspect-ratio:16/9;background:#000}
.cv-meta{padding:16px 18px 4px}
.cv-meta .t{font-size:20px;font-weight:750;letter-spacing:-.3px;line-height:1.25}
.cv-meta .a{font-size:14px;color:var(--text2);margin-top:6px}
.cv-ch{display:flex;align-items:center;gap:10px;margin-top:14px}
.cv-ch .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.cv-ch b{font-size:15.5px;display:block}
.cv-ch span{font-size:13px;color:var(--text2)}
.acts{display:flex;gap:8px;overflow-x:auto;padding:16px 18px 6px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.acts button{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--fill);font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;transition:transform .2s var(--spring)}
.acts button:active{transform:scale(.93)}
.acts button svg{width:18px;height:18px}
.acts button.on{color:var(--accent)}
.cv .h3{font-size:19px;font-weight:750;padding:20px 18px 12px;letter-spacing:-.3px}

/* push view */
.push{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateX(100%);transition:transform .5s var(--ease);overflow-y:auto;padding-bottom:calc(var(--sab) + 170px);scrollbar-width:none}
.push::-webkit-scrollbar{display:none}
.push.open{transform:none}
.push-top{position:sticky;top:0;z-index:5;padding:calc(var(--sat) + 4px) 8px 6px;display:flex;align-items:center;justify-content:space-between}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;font-weight:500;height:40px;padding:0 10px 0 4px;border-radius:20px}
.back svg{width:22px;height:22px}
.plh{text-align:center;padding:4px 40px 0}
.plh .mos{width:220px;margin:0 auto;box-shadow:0 24px 60px rgba(0,0,0,.45);border-radius:20px}
.plh h1{font-size:24px;font-weight:800;margin-top:18px;letter-spacing:-.5px}
.plh p{color:var(--text2);font-size:15px;margin-top:4px}
.plb{display:flex;gap:12px;padding:20px 16px 10px}

/* overlay sheets (action/input) */
.scrim{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.as{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);z-index:510;transform:translateY(120%);transition:transform .5s var(--ease);max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.as.show{transform:none}
.as .box{border-radius:22px;overflow:hidden;--glass-a:.72}
.as .ttl{padding:14px 16px 10px;text-align:center;font-size:13px;color:var(--text2);font-weight:500;line-height:1.35}
.as .ttl b{display:block;color:var(--text);font-size:14px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as .opt{width:100%;height:56px;font-size:18px;color:var(--accent);display:flex;align-items:center;justify-content:center;gap:10px;border-top:.5px solid var(--sep)}
.as .opt svg{width:20px;height:20px}
.as .opt.red{color:#ff453a}
.as .opt:active{background:var(--fill2)}
.as .cancel{font-weight:700}
.as .ipt{padding:4px 16px 16px}
.as .ipt input{width:100%;height:46px;border-radius:12px;border:0;outline:0;background:var(--fill2);padding:0 14px;font-size:17px;box-shadow:inset 0 0 0 .5px var(--sep);-webkit-user-select:text;user-select:text}
.as .scroll{max-height:42vh;overflow-y:auto}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);z-index:700;transform:translate(-50%,-150%);transition:transform .5s var(--spring);height:46px;border-radius:23px;padding:0 18px 0 12px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;max-width:calc(100% - 40px);--glass-a:.7;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none}
.toast .ti svg{width:15px;height:15px}
.toast span{overflow:hidden;text-overflow:ellipsis}

/* suggestions */
.sugg{position:absolute;left:16px;right:16px;z-index:30;border-radius:20px;overflow:hidden;display:none;--glass-a:.78;padding:4px 0;animation:sgIn .25s var(--ease)}
.sugg.show{display:block}
@keyframes sgIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sugg button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;font-size:16px;position:relative}
.sugg button+button::before{content:"";position:absolute;top:0;left:46px;right:0;border-top:.5px solid var(--sep)}
.sugg button:active{background:var(--fill2)}
.sugg svg{width:17px;height:17px;color:var(--text2);flex:none}
.sugg b{font-weight:700}
.sugg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.sugg span b{color:var(--text)}
.sugg i{font-style:normal;font-size:12px;color:var(--text3);flex:none}
.why{padding:0 20px 10px;margin-top:-6px;font-size:13.5px;color:var(--text2)}
.why b{color:var(--text);font-weight:600}

/* lyrics */
.lyr{display:none}
.np.lyrmode .lyr{display:block;flex:1;min-height:180px;overflow-y:auto;margin:14px -6px 0;padding:10px 6px 40vh;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 70%,transparent 100%)}
.np.lyrmode .lyr::-webkit-scrollbar{display:none}
.np.lyrmode .slot{width:54%;margin:0 auto;border-radius:16px;flex:none}
.np.lyrmode .np-meta{margin-top:12px}
.np.lyrmode .queue{display:none!important}
.lyr p{font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.22;margin:0 0 18px;color:rgba(255,255,255,.32);transition:color .35s,transform .45s var(--spring),filter .35s;transform-origin:left center;cursor:pointer;filter:blur(.4px)}
.lyr p.past{color:rgba(255,255,255,.5)}
.lyr p.on{color:#fff;transform:scale(1.03);filter:none;text-shadow:0 0 24px rgba(255,255,255,.25)}
.lyr.plain p{font-size:21px;color:rgba(255,255,255,.85);filter:none;cursor:default}
.lyr .msg{font-size:17px;color:rgba(255,255,255,.7);text-align:center;padding:40px 10px;line-height:1.5}
.lyr .src{font-size:12px;color:rgba(255,255,255,.4);margin-top:20px}
.np-bot .round.on{background:#fff;color:#000}

/* switch */
.tg{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.tg.on{background:#30d158}.tg.on::after{transform:translateX(20px)}

/* splash */
#splash{position:fixed;inset:0;z-index:1000;background:#050507;display:none;transition:opacity .55s var(--ease),transform .7s var(--ease),filter .55s}
#splash.run{display:block}
#splash.out{opacity:0;transform:scale(1.12);filter:blur(10px);pointer-events:none}
#splash svg{width:100%;height:100%}
#splash .skip{position:absolute;right:18px;bottom:calc(var(--sab) + 22px);font-size:13px;font-weight:600;color:rgba(255,255,255,.55);padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.08)}
#splash g,#splash circle,#splash rect,#splash path,#splash text{transform-box:view-box}
#splash .run-anim{animation-duration:4.2s;animation-timing-function:cubic-bezier(.45,0,.2,1);animation-fill-mode:both}
.sp-logo{animation-name:spLogo;transform-origin:0 0}
@keyframes spLogo{0%{transform:translate(195px,390px) scale(.55);opacity:0}9%{transform:translate(195px,390px) scale(1);opacity:1}34%{transform:translate(195px,390px) scale(1);opacity:1}42%{transform:translate(195px,390px) scale(.82);opacity:1}47%{transform:translate(195px,390px) scale(.4);opacity:0}100%{transform:translate(195px,390px) scale(.4);opacity:0}}
.sp-word{animation-name:spWord}
@keyframes spWord{0%,6%{opacity:0;transform:translateY(12px)}14%,32%{opacity:1;transform:none}40%,100%{opacity:0;transform:translateY(-8px)}}
.sp-bar{transform-origin:var(--ox) 0;animation:spWave .9s ease-in-out infinite;animation-delay:var(--d)}
@keyframes spWave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.1)}}
.sp-col{animation-name:spConv}
@keyframes spConv{0%,32%{transform:translateX(0)}44%,100%{transform:translateX(var(--cx))}}
.sp-bud{animation-name:spBud;transform-origin:0 0}
@keyframes spBud{0%,38%{transform:translate(195px,390px) scale(.2) rotate(0);opacity:0}46%{transform:translate(195px,390px) scale(2.5) rotate(-6deg);opacity:1}54%{transform:translate(195px,388px) scale(2.5) rotate(4deg);opacity:1}68%{transform:translate(200px,372px) scale(.85) rotate(8deg);opacity:1}100%{transform:translate(200px,372px) scale(.85) rotate(8deg);opacity:1}}
.sp-glow{animation-name:spGlow;transform-origin:195px 390px}
@keyframes spGlow{0%,38%{opacity:0;transform:scale(.3)}46%{opacity:.9;transform:scale(1.2)}58%{opacity:0;transform:scale(1.8)}100%{opacity:0}}
.sp-woman{animation-name:spWoman}
@keyframes spWoman{0%,50%{opacity:0;transform:translateY(46px)}62%,100%{opacity:1;transform:none}}
.sp-hand{animation-name:spHand;transform-origin:0 0}
@keyframes spHand{0%,66%{transform:translate(150px,760px) rotate(-36deg);opacity:0}70%{opacity:1}74%{transform:translate(166px,414px) rotate(-14deg);opacity:1}77%{transform:translate(171px,404px) rotate(-12deg)}80%{transform:translate(166px,414px) rotate(-14deg)}88%{transform:translate(150px,540px) rotate(-26deg);opacity:1}100%{transform:translate(140px,800px) rotate(-36deg);opacity:0}}
.sp-ring{animation-name:spRing;transform-origin:201px 371px;fill:none;stroke:#fff;stroke-width:2}
@keyframes spRing{0%,76%{opacity:0;transform:scale(.4)}80%{opacity:.8}92%,100%{opacity:0;transform:scale(2.6)}}
.sp-ring.r2{animation-name:spRing2}
@keyframes spRing2{0%,81%{opacity:0;transform:scale(.4)}85%{opacity:.6}97%,100%{opacity:0;transform:scale(2.8)}}
.sp-note{animation-name:spNote}
@keyframes spNote{0%,78%{opacity:0;transform:translate(0,0) scale(.6)}84%{opacity:1}100%{opacity:0;transform:translate(var(--nx),-90px) scale(1.1) rotate(var(--nr))}}
.sp-smile{animation-name:spSmile;transform-origin:279px 391px}
@keyframes spSmile{0%,74%{transform:scaleX(1)}84%,100%{transform:scaleX(1.25) translateY(-1px)}}

/* player host */
#playerHost{position:fixed;z-index:-1;left:-9999px;top:0;width:10px;height:10px;overflow:hidden;background:#000;transition:border-radius .3s}
#playerHost iframe,#playerHost #ytFrame{width:100%;height:100%;border:0;display:block}
#fakeArt{position:absolute;inset:0;display:none}
#fakeArt .art{width:100%;height:100%}
#playerHost.fake #fakeArt{display:block}
#playerHost.fake #ytWrap{visibility:hidden}
#ytWrap{position:absolute;inset:0}
</style>

/* ================= YouTube API ================= */
const API='https://www.googleapis.com/youtube/v3/';
const cache=store.get('cache',{});
function cacheGet(k,ttl){const c=cache[k];return c&&Date.now()-c.t<ttl?c.v:null}
function cacheSet(k,v){cache[k]={t:Date.now(),v};const ks=Object.keys(cache);if(ks.length>40){ks.sort((a,b)=>cache[a].t-cache[b].t).slice(0,ks.length-40).forEach(x=>delete cache[x])}store.set('cache',cache)}
async function api(path,params){
  const u=new URL(API+path);Object.entries({...params,key:S.key}).forEach(([k,v])=>u.searchParams.set(k,v));
  let r;try{r=await fetch(u)}catch(e){throw new Error('Pas de connexion Internet')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const reason=j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason||'';
    if(/quota/i.test(reason))throw new Error('Quota du jour atteint — réessaie demain');
    if(/keyInvalid|badRequest/i.test(reason)||r.status===400)throw new Error('Clé API invalide');
    if(r.status===403)throw new Error('Clé refusée : vérifie que « YouTube Data API v3 » est activée');
    throw new Error((j.error&&j.error.message)||'Erreur '+r.status)}
  return j;
}
function cleanTitle(raw,channel,kind){
  let t=decode(raw), a=decode(channel||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').replace(/\s*Official$/i,'').trim();
  if(kind==='music'){
    t=t.replace(/\s*[\(\[][^\)\]]*(official|officiel|audio|video|vidéo|clip|lyrics?|paroles|visuali[sz]er|music|hd|4k)[^\)\]]*[\)\]]/gi,'').replace(/\s*\|.*$/,'').trim();
    const m=t.split(/\s+[-–—]\s+/);if(m.length>=2){a=m[0].trim();t=m.slice(1).join(' - ').trim()}
  }
  return {title:t||decode(raw),artist:a};
}
async function enrich(items){
  if(!items.length)return items;
  const j=await api('videos',{part:'contentDetails,statistics',id:items.map(i=>i.id).join(',')});
  const map={};(j.items||[]).forEach(v=>map[v.id]=v);
  items.forEach(i=>{const v=map[i.id];if(v){i.dur=isoDur(v.contentDetails.duration);i.views=+v.statistics.viewCount||0}});
  return items;
}
async function ytSearch(q,kind){
  const ck=kind+':'+q.toLowerCase();const c=cacheGet(ck,24*3600e3);if(c)return c;
  const j=await api('search',{part:'snippet',type:'video',videoEmbeddable:'true',maxResults:'25',videoCategoryId:'10',q:kind==='music'?q+' audio':q+' official video',safeSearch:'moderate'});
  let items=(j.items||[]).filter(x=>x.id&&x.id.videoId).map(x=>{const c=cleanTitle(x.snippet.title,x.snippet.channelTitle,kind);return {id:x.id.videoId,title:c.title,artist:c.artist,channel:decode(x.snippet.channelTitle),kind,date:x.snippet.publishedAt}});
  try{await enrich(items)}catch(e){}
  if(kind==='music')items=items.filter(i=>!i.dur||i.dur<900);
  cacheSet(ck,items);return items;
}
async function ytTrending(){
  const c=cacheGet('trend:'+S.region,6*3600e3);if(c)return c;
  let j;try{j=await api('videos',{part:'snippet,contentDetails,statistics',chart:'mostPopular',videoCategoryId:'10',regionCode:S.region,maxResults:'25'})}catch(e){j=null}
  if(!j||!(j.items||[]).length)j=await api('videos',{part:'snippet,contentDetails,statistics',chart:'mostPopular',videoCategoryId:'10',regionCode:'FR',maxResults:'25'});
  const items=(j.items||[]).map(v=>{const cm=cleanTitle(v.snippet.title,v.snippet.channelTitle,'music');return {id:v.id,title:decode(v.snippet.title),mTitle:cm.title,artist:cm.artist,channel:decode(v.snippet.channelTitle),dur:isoDur(v.contentDetails.duration),views:+v.statistics.viewCount||0,date:v.snippet.publishedAt,kind:'clip'}});
  cacheSet('trend:'+S.region,items);return items;
}

function ensureYT(){
  if(ytReady)return ytReady;
  ytReady=new Promise((res,rej)=>{
    const to=setTimeout(()=>rej(new Error('Lecteur YouTube indisponible')),12000);
    window.onYouTubeIframeAPIReady=()=>{
      try{
        yt=new YT.Player('ytFrame',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,modestbranding:1,fs:1,iv_load_policy:3,origin:location.origin},
          events:{onReady:()=>{clearTimeout(to);res(yt)},onStateChange:e=>onYTState(e.data),onError:e=>onYTError(e.data)}});
      }catch(e){clearTimeout(to);rej(e)}
    };
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{clearTimeout(to);rej(new Error('Lecteur YouTube indisponible'))};document.head.appendChild(s);
  });
  ytReady.catch(()=>{ytReady=null});
  return ytReady;
}
function onYTState(st){

function load(item){

    host.classList.add('fake');fakeArt.innerHTML=art(item);

    const go=()=>{try{yt.loadVideoById(item.id);}catch(e){}
      clearTimeout(P.startWatch);P.startWatch=setTimeout(()=>{if(P.item===item&&ytState!==1&&ytState!==3){$(S.clipOpen?'#clipHint':'#npHint').classList.add('show')}},2200)};

function playQueue(arr,i,mode='music',from){
  S.queue=arr.map(x=>mode==='music'&&x.kind==='clip'?asMusic(x):x);S.qi=i;S.mode=mode;if(from)S.from=from;

function next(auto){
  if(!S.queue.length)return;
  if(S.repeat==='one'&&auto){seek(0);play();return}
  let n;if(S.shuffle&&S.queue.length>1){do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi)}else n=S.qi+1;
  if(n>=S.queue.length){if(S.repeat==='all'||!auto)n=0;else{pause();return}}
  S.qi=n;load(S.queue[n]);renderQueue();if(S.clipOpen)renderClip();
}
function prev(){if(!S.queue.length)return;if(curTime()>4){seek(0);return}S.qi=(S.qi-1+S.queue.length)%S.queue.length;load(S.queue[S.qi]);renderQueue();if(S.clipOpen)renderClip()}

async function doSearch(kind,q){
  q=q.trim();if(!q)return;
  const rk=kind==='music'?'recentM':'recentC';S[rk]=[q,...S[rk].filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,6);store.set(rk,S[rk]);
  const form=$(`form[data-kind="${kind}"]`);form.querySelector('input').value=q;form.classList.add('has');
  if(kind==='music'){S.mQ=q;S.mErr=null;S.mLoading=true;renderMusic()}else{S.cQ=q;S.cErr=null;S.cLoading=true;renderClips()}
  $('#s-'+(kind==='music'?'music':'clips')).scrollTo({top:0,behavior:'smooth'});
  let res;
  try{
    if(demoMode()){await new Promise(r=>setTimeout(r,550));res=demoItems(kind,q).map(x=>({...x,artist:x.artist}))}
    else res=await ytSearch(q,kind);
  }catch(e){if(kind==='music')S.mErr=e.message;else S.cErr=e.message}

}

    ${others.length?`<div class="h3">À suivre</div>${others.slice(0,20).map(o=>clipCard(o.x,n,o.i)).join('')}`:''}`;

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;

  if(a!=='menu'&&el.tagName!=='A')e.preventDefault();

    case 'sugg':hideSugg(el.dataset.kind);doSearch(el.dataset.kind,el.dataset.q);break;

    case 'lyrSeek':if(lyrState&&lyrState.lines&&lyrState.lines[i]){seek(lyrState.lines[i].t);if(!isPlaying())play()}break;
    case 'toggleSplash':{const v=!store.get('splash',true);store.set('splash',v);el.querySelector('.tg').classList.toggle('on',v);toast(v?'Animation d’ouverture activée':'Animation d’ouverture désactivée');break}

      if(it.kind==='clip'){const clipsOnly=L.filter(x=>x.kind==='clip');playQueue(clipsOnly,clipsOnly.indexOf(it),'clip')}
      else{const mus=L.filter(x=>x.kind!=='clip');playQueue(mus,mus.indexOf(it),'music',fromName(el.dataset.list));}
      break}
    case 'menu':e.preventDefault();e.stopPropagation();{const it=L[i];if(it)itemMenu(it,el.dataset.list==='pl'?{pl:S.pls.find(p=>p.id===S.openPl)}:el.dataset.list==='hist'?{hist:1}:null)}break;
    case 'playAll':case 'shuffleAll':{if(!L||!L.length)break;const mus=L.filter(x=>x.kind!=='clip');const arr=mus.length?mus:L.map(asMusic);S.shuffle=a==='shuffleAll';playQueue(arr,S.shuffle?Math.floor(Math.random()*arr.length):0,'music',fromName(el.dataset.list));openPlayer();break}
    case 'searchChip':doSearch(el.dataset.kind,el.dataset.q);break;
    case 'openPlayer':openPlayer();break;
    case 'closePlayer':closePlayer();break;
    case 'toggle':toggle();break;
    case 'next':next(false);break;
    case 'prev':prev();break;
    case 'shuffle':S.shuffle=!S.shuffle;toast(S.shuffle?'Lecture aléatoire activée':'Lecture aléatoire désactivée');syncUI();break;
    case 'repeat':S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';toast({off:'Répétition désactivée',all:'Répéter la liste',one:'Répéter ce titre'}[S.repeat]);renderQueue();break;
    case 'queue':{const q=$('#npQueue');q.classList.toggle('show');$('#npQBtn').classList.toggle('on',q.classList.contains('show'));if(q.classList.contains('show'))setTimeout(()=>q.scrollIntoView({behavior:'smooth'}),50);break}
    case 'favCurrent':toggleFav(P.item);break;
    case 'addPlCurrent':P.item&&pickPl(P.item);break;
    case 'copyCurrent':P.item&&copy('https://youtu.be/'+P.item.id);break;
    case 'watchClip':if(P.item){S.mode='clip';S.queue=S.queue.map(x=>({...x,kind:'clip'}));P.item=S.queue[S.qi];openClip()}break;
    case 'audioOnly':if(P.item){S.mode='music';S.queue=S.queue.map(x=>({...x,kind:'music'}));P.item=S.queue[S.qi];S.from=P.item.artist;closeClip();setTimeout(openPlayer,250)}break;
    case 'npMenu':P.item&&itemMenu(P.item);break;
    case 'clipMenu':P.item&&itemMenu(P.item);break;
    case 'closeClip':closeClip();break;
    case 'asPick':{const f=asActs[i]&&asActs[i].f;closeAS();f&&f();break}
    case 'asOk':asActs[0]&&asActs[0].f();break;
    case 'closeAS':closeAS();break;

      {l:'Renommer',i:I.pencil,f:()=>setTimeout(()=>inputSheet('Renommer','Nom','Renommer',v=>{pl.name=v;savePls();renderPl();renderLibrary()},pl.name),350)},
      {l:'Supprimer la playlist',i:I.trash,red:true,f:()=>{S.pls=S.pls.filter(p=>p!==pl);savePls();$('#plView').classList.remove('open');S.openPl=null;renderLibrary();toast('Playlist supprimée')}}]);break}
    case 'clearHist':S.hist=[];store.set('hist',[]);toast('Historique effacé');if(S.tab==='library')renderLibrary();break;
    case 'clearCache':Object.keys(cache).forEach(k=>delete cache[k]);store.set('cache',{});S.trending=null;toast('Cache vidé');break;
    case 'resetAll':actionSheet('Tout réinitialiser ?','Favoris, playlists, historique et clé API seront effacés de ce téléphone.',[{l:'Tout effacer',i:I.trash,red:true,f:()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('sonora.')).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}}]);break;
    case 'toggleKey':{const k=$('#keyIn');k.type=k.type==='password'?'text':'password';break}
    case 'saveKey':{const v=$('#keyIn').value.trim();S.key=v;store.set('key',v);S.keyStatus=null;S.trending=null;S.mRes=S.cRes=null;S.mErr=S.cErr=null;renderSettings();renderMusic();renderClips();toast(v?'Clé enregistrée':'Mode démo activé');if(v){ensureYT().catch(()=>{});testKey()}break}
    case 'testKey':{const v=$('#keyIn').value.trim();if(v!==S.key){S.key=v;store.set('key',v)}testKey();break}

  }
});

/* swipe down to close sheets */
function swipeClose(sheet,scroller,close){
  let y0=null,dy=0;
  sheet.addEventListener('touchstart',e=>{if(scroller.scrollTop>0||e.target.closest('input[type=range]')||e.target.closest('.slot')){y0=null;return}y0=e.touches[0].clientY;dy=0},{passive:true});
  sheet.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sheet.classList.add('drag');sheet.style.transform=`translateY(${dy}px)`}},{passive:true});
  sheet.addEventListener('touchend',()=>{if(y0==null)return;sheet.classList.remove('drag');sheet.style.transform='';if(dy>110)close();y0=null});
}

function endSplash(){if(!splash.classList.contains('run')||splash.classList.contains('out'))return;clearTimeout(splashTO);splash.classList.add('out');setTimeout(()=>splash.classList.remove('run','out'),700)}

/* ================= suggestions ================= */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let sgTimer=null, sgSeq=0, sgReq=0;
function jsonp(url,ms=2500){return new Promise((res,rej)=>{const cb='__sg'+(++sgSeq);const s=document.createElement('script');const to=setTimeout(()=>{clean();rej(new Error('timeout'))},ms);function clean(){clearTimeout(to);delete window[cb];s.remove()}window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej(new Error('net'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s)})}
function localSugg(q,kind){
  const nq=norm(q);const out=[];const seen=new Set();
  const push=(t,type)=>{const k=norm(t);if(!t||seen.has(k))return;if(nq&&!k.includes(nq))return;seen.add(k);out.push({t,type})};
  (kind==='music'?S.recentM:S.recentC).forEach(t=>push(t,'recent'));
  [...S.favs,...S.hist].forEach(it=>push(it.artist,'artist'));
  if(nq)S.hist.forEach(it=>push(it.title,'title'));
  return out.slice(0,nq?4:6);
}
async function remoteSugg(q){
  if(!q||q.length<2)return [];
  try{const d=await jsonp('https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl=fr&q='+encodeURIComponent(q));return (d&&d[1]||[]).map(x=>Array.isArray(x)?x[0]:x).filter(Boolean).slice(0,7)}catch(e){return []}
}
function hl(t,q){const i=norm(t).indexOf(norm(q));if(!q||i<0)return esc(t);return esc(t.slice(0,i))+'<b>'+esc(t.slice(i,i+q.length))+'</b>'+esc(t.slice(i+q.length))}
async function updateSugg(kind){
  const form=$(`form[data-kind="${kind}"]`),box=$('#sugg-'+kind),q=form.querySelector('input').value.trim();
  if(document.activeElement!==form.querySelector('input')){box.classList.remove('show');return}
  const my=++sgReq;let loc=localSugg(q,kind);
  const draw=(rem)=>{
    const seen=new Set(loc.map(x=>norm(x.t)));const r=(rem||[]).filter(t=>!seen.has(norm(t))).map(t=>({t,type:'web'}));
    const all=[...loc,...r].slice(0,8);
    if(!all.length){box.classList.remove('show');return}
    const ic={recent:I.clock,artist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',title:I.note,web:I.search};
    const lab={recent:'Récent',artist:'Artiste',title:'Écouté',web:''};
    box.innerHTML=all.map(x=>`<button data-act="sugg" data-kind="${kind}" data-q="${esc(x.t)}">${ic[x.type]}<span>${hl(x.t,q)}</span><i>${lab[x.type]}</i></button>`).join('');
    box.style.top=(form.offsetTop+form.offsetHeight+6)+'px';box.classList.add('show');
  };
  draw();
  if(q.length>=2&&!demoMode()){const rem=await remoteSugg(q);if(my!==sgReq)return;if(form.querySelector('input').value.trim()===q)draw(rem)}
}
function hideSugg(kind){const b=$('#sugg-'+kind);b&&b.classList.remove('show')}
$$('form.search').forEach(f=>{const inp=f.querySelector('input'),kind=f.dataset.kind;
  inp.addEventListener('input',()=>{clearTimeout(sgTimer);sgTimer=setTimeout(()=>updateSugg(kind),180)});
  inp.addEventListener('focus',()=>updateSugg(kind));
  inp.addEventListener('blur',()=>setTimeout(()=>hideSugg(kind),220));
  f.addEventListener('submit',()=>hideSugg(kind));
});

/* ================= pour toi ================= */
function topArtists(){
  const c={};const add=(a,w)=>{if(!a||/^(artiste|various)/i.test(a))return;c[a]=(c[a]||0)+w};
  S.hist.forEach((h,i)=>add(h.artist,i<10?2:1));S.favs.forEach(f=>add(f.artist,3));
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
let fyLoading=false;
async function loadForYou(){
  if(fyLoading)return;const arts=topArtists();if(!arts.length)return;
  fyLoading=true;
  try{
    const pick=arts.slice(0,2);const heard=new Set(S.hist.map(h=>h.id));
    let lists;
    if(demoMode()){lists=pick.map(a=>demoItems('music',a))}
    else lists=await Promise.all(pick.map(a=>ytSearch(a,'music').catch(()=>[])));
    const mix=[];const max=Math.max(...lists.map(l=>l.length));
    for(let i=0;i<max;i++)lists.forEach(l=>{const it=l[i];if(it&&!mix.some(m=>m.id===it.id))mix.push(it)});
    const fresh=mix.filter(it=>!heard.has(it.id));
    S.forYou={because:pick,items:(fresh.length>=6?fresh:mix).slice(0,14),key:pick.join('|')};
    if(!demoMode()){const cl=await ytSearch(pick[0],'clip').catch(()=>[]);S.forYouC={because:pick[0],items:cl.filter(it=>!heard.has(it.id)).slice(0,4),key:pick[0]}}
    else S.forYouC={because:pick[0],items:demoItems('clip',pick[0]).slice(0,4),key:pick[0]};
  }finally{fyLoading=false}
  if(S.tab==='music'&&!S.mRes)renderMusic();if(S.tab==='clips'&&!S.cRes)renderClips();
}
function forYouHTML(){
  const arts=topArtists();if(!arts.length)return '';
  const key=arts.slice(0,2).join('|');
  if(!S.forYou||S.forYou.key!==key){setTimeout(loadForYou,0);return S.forYou&&S.forYou.items.length?'':`<div class="sec"><div class="sh"><h2>Pour toi</h2></div><div class="hs">${Array.from({length:4},()=>'<div class="sq"><div class="art skel"></div></div>').join('')}</div></div>`}
  if(!S.forYou.items.length)return '';
  const n=reg('mfy',S.forYou.items);const b=S.forYou.because;
  return `<div class="sec"><div class="sh"><h2>Pour toi</h2><button class="more" data-act="playAll" data-list="mfy">Tout lire</button></div><div class="why">Parce que tu écoutes <b>${esc(b[0])}</b>${b[1]?` et <b>${esc(b[1])}</b>`:''}</div><div class="hs">${S.forYou.items.map((it,i)=>sq(it,n,i)).join('')}</div></div>`;
}
function forYouClipsHTML(){
  const f=S.forYouC;if(!f||!f.items.length)return '';
  const n=reg('cfy',f.items);
  return `<div class="sec"><div class="sh"><h2>Pour toi</h2></div><div class="why">Des clips de <b>${esc(f.because)}</b> et autour</div>${f.items.map((it,i)=>clipCard(it,n,i)).join('')}</div>`;
}

/* ================= paroles ================= */
const lyrCache={};let lyrState=null;
const DEMO_LYR=['La ville s’allume, je monte le son','Le plateau respire au rythme de mon cœur','On danse encore, personne ne rentre','Sous les lumières, tout devient plus doux','Lève les mains, laisse-toi porter','Cette nuit est à nous, elle ne finit pas','La lagune brille comme un miroir','Je chante ton nom jusqu’au matin','Oh oh, ne t’arrête pas','Oh oh, la musique nous tient','On danse encore, personne ne rentre','Cette nuit est à nous'];
function parseLRC(t){const out=[];(t||'').split(/\r?\n/).forEach(line=>{const tags=[...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];const txt=line.replace(/\[[^\]]*\]/g,'').trim();tags.forEach(m=>out.push({t:+m[1]*60+ +m[2],l:txt}))});return out.sort((a,b)=>a.t-b.t).filter((x,i,a)=>x.l||(a[i+1]&&a[i+1].l))}
async function fetchLyrics(it){
  if(lyrCache[it.id])return lyrCache[it.id];
  let res;
  if(it.demo){const step=Math.max(5,(it.dur||180)/(DEMO_LYR.length+2));res={synced:DEMO_LYR.map((l,i)=>({t:4+i*step,l})),src:'démo'}}
  else{
    const art=(it.artist||'').replace(/\s*(official|officiel|vevo|music|tv)$/i,'').trim(), tit=(it.title||'').replace(/\s*(ft\.?|feat\.?).*$/i,'').trim();
    const tryUrl=async u=>{try{const r=await fetch(u);if(!r.ok)return [];const j=await r.json();return Array.isArray(j)?j:[j]}catch(e){return null}};
    let list=await tryUrl(`https://lrclib.net/api/search?track_name=${encodeURIComponent(tit)}&artist_name=${encodeURIComponent(art)}`);
    if(list===null)return {err:'net'};
    if(!list.length)list=await tryUrl(`https://lrclib.net/api/search?q=${encodeURIComponent(art+' '+tit)}`)||[];
    const d=duration()||it.dur||0;
    list.sort((a,b)=>((b.syncedLyrics?1:0)-(a.syncedLyrics?1:0))||(Math.abs((a.duration||0)-d)-Math.abs((b.duration||0)-d)));
    const best=list.find(x=>x.syncedLyrics||x.plainLyrics);
    if(!best)res={none:true};
    else if(best.syncedLyrics&&(!d||Math.abs((best.duration||d)-d)<25))res={synced:parseLRC(best.syncedLyrics),src:'LRCLIB'};
    else res={plain:(best.plainLyrics||best.syncedLyrics.replace(/\[[^\]]*\]/g,'')).trim(),src:'LRCLIB'};
  }
  lyrCache[it.id]=res;return res;
}
async function loadLyrics(){
  const box=$('#npLyr'),it=P.item;if(!it)return;
  lyrState={id:it.id,lines:null,cur:-1};
  box.className='lyr';box.innerHTML='<div class="msg"><div class="spin" style="margin:10px auto 14px"></div>Recherche des paroles…</div>';
  const r=await fetchLyrics(it);if(!P.item||P.item.id!==it.id)return;
  if(r.err){box.innerHTML='<div class="msg">Impossible de charger les paroles.<br>Vérifie ta connexion.</div>';return}
  if(r.none){box.innerHTML=`<div class="msg">Paroles indisponibles pour ce titre.</div>`;return}
  if(r.synced&&r.synced.length){lyrState.lines=r.synced;box.innerHTML=r.synced.map((x,i)=>`<p data-act="lyrSeek" data-i="${i}">${x.l?esc(x.l):'♪'}</p>`).join('')+`<div class="src">Paroles · ${esc(r.src)}</div>`;syncLyrics(true)}
  else{box.classList.add('plain');box.innerHTML=r.plain.split(/\n/).map(l=>`<p>${esc(l)||'&nbsp;'}</p>`).join('')+`<div class="src">Paroles · ${esc(r.src)} · non synchronisées</div>`}
}
function syncLyrics(force){
  if(!S.lyrOpen||!lyrState||!lyrState.lines||!P.item||lyrState.id!==P.item.id)return;
  const t=curTime()+0.25,L=lyrState.lines;let i=-1;for(let k=0;k<L.length;k++){if(L[k].t<=t)i=k;else break}
  if(i===lyrState.cur&&!force)return;lyrState.cur=i;
  const box=$('#npLyr'),ps=box.querySelectorAll('p');
  ps.forEach((p,k)=>{p.classList.toggle('on',k===i);p.classList.toggle('past',k<i)});
  const el=ps[Math.max(0,i)];if(el)box.scrollTo({top:el.offsetTop-box.clientHeight*.3,behavior:force?'auto':'smooth'});
}
setInterval(syncLyrics,250);
function toggleLyrics(){
  S.lyrOpen=!S.lyrOpen;$('#np').classList.toggle('lyrmode',S.lyrOpen);$('#npLyrBtn').classList.toggle('on',S.lyrOpen);
  if(S.lyrOpen){$('#npQueue').classList.remove('show');$('#npQBtn').classList.remove('on');if(!lyrState||!P.item||lyrState.id!==P.item.id)loadLyrics();else syncLyrics(true)}
}
